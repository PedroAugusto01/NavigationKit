name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run tests (NavigationKitCore + NavigationKit + NavigationKitMock)
        run: |
          xcodebuild test \
            -scheme NavigationKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipMacroValidation
